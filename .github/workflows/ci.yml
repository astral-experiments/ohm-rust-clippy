name: CI

on:
  pull_request:
  push:
    branches: [ohm-1.98.1]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Formatting and lint registration
    runs-on: depot-ubuntu-24.04-4
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-06-25
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the nightly formatter
        run: rustup toolchain install nightly-2026-06-25 --profile minimal --component rustfmt --component rustc-dev --component llvm-tools

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check lint registration
        run: cargo dev update_lints --check

      - name: Check formatting
        run: cargo dev fmt --check

  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Tests
            runner: depot-ubuntu-24.04-16
          - name: Tests (macOS)
            runner: namespace-profile-macos-15
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      NO_FMT_TEST: 1
      RUSTC_BOOTSTRAP: 1
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the matching compiler
        run: rustup toolchain install 1.98.1 --profile minimal --component rustc-dev --component llvm-tools --component rust-src

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build tests and internal lints
        run: cargo build --tests --features internal

      - name: Test UI, configuration, and internal lints
        run: cargo test --features internal -- --skip check_host_compiler

      - name: Test lint implementations
        run: cargo test
        working-directory: clippy_lints

      - name: Test lint utilities
        run: cargo test
        working-directory: clippy_utils

      - name: Test lint configuration
        run: cargo test
        working-directory: clippy_config

      - name: Test compiler tooling utilities
        run: cargo test
        working-directory: rustc_tools_util

      - name: Test developer tooling
        run: cargo test
        working-directory: clippy_dev

      - name: Test the Clippy driver
        run: .github/driver.sh
        env:
          OS: ${{ runner.os }}
